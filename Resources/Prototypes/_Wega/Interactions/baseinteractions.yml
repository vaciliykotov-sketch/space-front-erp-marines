- type: interactionAction
  id: BaseAliveMobAction
  abstract: true
  canInteractSelf: true
  conditions:
  - !type:MobStateCondition
    invert: true
    state: Dead

- type: interactionAction
  parent: BaseAliveMobAction
  id: BaseHarmAction
  abstract: true
  conditions:
  - !type:DistanceCondition
    maxRange: 0.8
