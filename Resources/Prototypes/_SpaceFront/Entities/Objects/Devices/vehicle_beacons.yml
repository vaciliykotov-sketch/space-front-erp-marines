# Маяки техники — при использовании спавнят машину рядом.
# Продаются в карго за 1 доллар.

- type: entity
  parent: BaseItem
  id: RMCVehicleBeaconHumvee
  name: "Маяк техники: Хамви"
  description: Портативный маяк десантирования техники. Используйте на открытом месте, чтобы вызвать Хамви.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/asrs_console.rsi
    state: on
  - type: Item
    size: Normal
  - type: RMCSpawnVehicleOnUse
    vehicle: VehicleHumvee

