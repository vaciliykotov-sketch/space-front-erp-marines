# Ящики заказа техники: при доставке машина появляется по центру грузовой платформы,
# модули лежат в ящике. Всё по 1 доллару.

- type: entity
  parent: RMCCrateAmmo
  id: RMCCrateVehicleHumvee
  name: "Заказ техники: Хамви"
  description: Доставка Хамви на грузовую платформу вместе с полным комплектом модулей.
  components:
  - type: RMCSpawnVehicleOnOrder
    vehicle: VehicleHumvee
    hardpoints:
    - VehicleHumveeTurret
    - VehicleHumveeCannon
    - VehicleHumveeLauncher
    - VehicleHumveeSnowplow
    - VehicleHumveeOverlight
    - VehicleHumveeHatch
    - VehicleHumveeWheel

