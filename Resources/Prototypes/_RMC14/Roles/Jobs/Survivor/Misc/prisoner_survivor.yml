# Used in Fiorina Science Annex
- type: job
  parent: CMSurvivor
  id: CMSurvivorPrisoner
  name: cm-job-name-survivor-prisoner
  description: cm-job-description-survivor
  playTimeTracker: CMJobSurvivor
  setPreference: false
  startingGear: RMCGearSurvivorPrisoner
  spawnMenuRoleName: Prisoner (Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      preset: RMCSkillPresetSurvivorPrisoner
    - type: EquipSurvivorPreset
      preset: RMCGearSurvivorPresetPrisoner
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: NpcFactionMember
      factions:
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: RMCAllowSuitStorage
  useLoadoutOfJob: CMSurvivor # for inheritance

- type: startingGear
  parent: RMCGearSurvivorBaseNoBackpack
  id: RMCGearSurvivorPrisoner
  equipment:
    jumpsuit: RMCJumpsuitOrange
    back: RMCSatchelCivilianFill
    shoes: RMCShoesOrange
    pocket2: RMCPouchGeneralMedium

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointSurvivorPrisoner
  name: "точка появления заключённого"
  components:
  - type: SpawnPoint
    job_id: CMSurvivorPrisoner
  - type: Sprite
    layers:
    - sprite: _RMC14/Markers/landmarks.rsi
      state: surv

- type: entity
  parent: RMCSurvivorPresetCivilian
  id: RMCGearSurvivorPresetPrisoner
  name: "предустановка выжившего-заключённого"
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityPreset
    randomOutfits:
    - [ ArmorHelmetRiot ]
    - [ RMCArmorVestCivilian ]
