- type: job
  parent: CMJobBase
  id: RMCJobSynthetic
  hidden: true # Space Front: роль синтетика удалена
  name: rmc-job-name-synth
  description: rmc-job-description-synth
  playTimeTracker: RMCJobSynthetic
  requirements:
  - !type:DepartmentTimeRequirement
    department: CMSquad
    time: 3600 # 1 hour
  - !type:DepartmentTimeRequirement
    department: CMRequisitions
    time: 3600 # 1 hour
  - !type:TotalJobsTimeRequirement
    group: CMJobsEngineering
    time: 3600 # 1 hour
  - !type:DepartmentTimeRequirement
    department: CMAuxiliarySupport
    time: 3600 # 1 hour
  - !type:DepartmentTimeRequirement
    department: CMMedbay
    time: 3600 # 1 hour
  - !type:DepartmentTimeRequirement
    department: CMMilitaryPolice
    time: 3600 # 1 hour
  - !type:DepartmentTimeRequirement
    department: CMCommand
    time: 3600 # 1 hour
  ranks:
    RMCRankChiefWarrantOfficer:
    - !type:RoleTimeRequirement
      role: RMCJobSynthetic
      time: 270000 # 75 hours
    RMCRankWarrantOfficer: [ ]
  startingGear: RMCGearSyntheticEquipped
  dummyStartingGear: RMCGearSyntheticEquipped
  icon: "RMCJobIconSynth"
  joinNotifyCrew: true
  supervisors: rmc-job-supervisors-commander
  accessGroups:
  - ShipMasterAccess
  - Synth
  roleWeight: 0.25
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      preset: RMCLanguagePresetSynth
    - type: LanguageLearning
      preset: RMCLanguageLearningPresetSynth
    - type: CMVendorUser
      id: RMCJobSynthetic
      points: 45
      extraPoints:
        ExperimentalTools: 30
    - type: JobPrefix
      prefix: rmc-job-prefix-synth
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
    - type: Synth
    - type: RMCPointing

- type: startingGear
  id: RMCGearSyntheticEquipped
  equipment:
    gloves: CMHandsInsulated
    shoes: RMCShoesWhite
    id: RMCIDCardSynth
    ears: RMCHeadsetSynth
    belt: CMBeltUtilityFilled
    pocket1: RMCUniversalRecorder

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointSynth
  name: "точка появления синтета"
  components:
  - type: SpawnPoint
    job_id: RMCJobSynthetic
  - type: Sprite
    state: syn_spawn

- type: playTimeTracker
  id: RMCJobSynthetic
  isHumanoid: true
