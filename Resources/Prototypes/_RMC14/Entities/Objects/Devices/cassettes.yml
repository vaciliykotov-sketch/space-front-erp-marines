- type: entity
  parent: BaseItem
  id: RMCCassettePlayer
  name: "кассета player"
  description: A cassette player that first hit the market over 100 years ago. Crazy how these never went out of style.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/cassette_player.rsi
    layers:
    - state: walkman
      map: ["base" ]
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - ears
  - type: CassettePlayer
  - type: ClothingLimit
    slot: All
    id: RMCCassettePlayer
  - type: RandomSprite
    available:
    - base:
        walkman: ""
        walkman_1: ""
        walkman_2: ""
        walkman_3: ""
        walkman_4: ""
        walkman_5: ""
    
- type: entity
  abstract: true
  parent: BaseItem
  id: RMCCassetteTapeBase
  name: "кассета"
  description: A plastic cassette tape.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/cassette_player.rsi
    state: cassette_blue
  - type: Item
    size: Small
  - type: CassetteTape

