  name: "ретрактор"
  description: Retracts stuff.
  components:
  - type: Item
    size: Small
  - type: CMSurgeryTool
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: StaticPrice
    price: 24

# Retractor
- type: entity
