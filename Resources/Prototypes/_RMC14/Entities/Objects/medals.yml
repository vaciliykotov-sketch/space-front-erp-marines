# Marine medals

- type: entity
  parent: RMCMedalBase
  id: RMCMedalBronze
  name: "бронзовая медаль"
  description: A bronze medal.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/bronze.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/bronze.rsi
      state: equipped

- type: entity
  parent: RMCMedalBronze
  id: RMCMedalBronzeDistinguishedConduct
  name: "медаль за выдающееся поведение"
  description: A bronze medal awarded for distinguished conduct. Whilst a great honor, this is the most basic award given by the UNMC.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/bronze.rsi
    state: icon_co
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/bronze.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalBronze
  id: RMCMedalBronzeHeart
  name: "бронзовая медаль «Сердце»"
  description: A bronze heart-shaped medal awarded for sacrifice. It is often awarded posthumously or for severe injury in the line of duty.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/bronze_heart.rsi
    state: bronze_heart
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/bronze_heart.rsi
      state: equipped

- type: entity
  parent: RMCMedalBronze
  id: RMCMedalBronzeService
  name: "бронзовая медаль за службу"
  description: A bronze medal awarded for a marine's service within the UNMC. While the most common of medals, it signifies someone's first few steps into their respective positions.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalSilver
  name: "серебряная медаль"
  description: A silver medal.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/silver.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/silver.rsi
      state: equipped

- type: entity
  parent: RMCMedalSilver
  id: RMCMedalSilverValor
  name: "медаль of valor"
  description: A silver medal awarded for acts of exceptional valor. Normally given to those who outstand themselves from the ranks, either it be in Leadership skills or actions crucial to the mission success.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/silver.rsi
    state: icon_co
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/silver.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalSilver
  id: RMCMedalSilverService
  name: "серебряная медаль за службу"
  description: A shiny silver medal awarded for a marine's service within the UNMC. While somewhat common, it signifies someone's growing expertise and time invested into their department and skills.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalGold
  name: "золотая медаль"
  description: A prestigious golden medal.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/gold.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/gold.rsi
      state: equipped

- type: entity
  parent: RMCMedalGold
  id: RMCMedalGoldExceptionalHeroism
  name: "медаль of exceptional heroism"
  description: An extremely rare golden medal awarded only by the UNMC. To receive such a medal is the highest honor and as such, very few exist.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/gold.rsi
    state: icon_co
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/gold.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalGold
  id: RMCMedalHighCommandHonor
  name: "Медаль Почёта Верховного командования UNMC"
  description: A star-shaped golden medal bestowed solely by UNMC High Command. It is not earned through valor alone, but granted by command authority for deeds that transcend recognized heroism. As the UNMC’s ultimate distinction, it eclipses every other commendation. Its recipients are known to history, not statistics.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/gold_star.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/gold_star.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalGold
  id: RMCMedalGoldService
  name: "золотая медаль за службу"
  description: A reflective gold medal awarded for a marine's service within the UNMC. It represents the first major step of many a marine takes in becoming highly qualified in their positions.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalPlatinum
  name: "платиновая медаль"
  description: An esteemed platinum medal, only able to be handed out by generals due to special circumstances.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/platinum.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/platinum.rsi
      state: equipped

- type: entity
  parent: RMCMedalPlatinum
  id: RMCMedalPlatinumService
  name: "платиновая медаль за службу"
  description: A dark blue medal awarded for a marine's service within the UNMC. These medals are issued to those who have shown a clear passion for their position and its success.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalRuby
  name: "рубиновая медаль"
  description: An exalted ruby medal, only able to be handed out by Generals due to special circumstances.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/ruby.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/ruby.rsi
      state: equipped

- type: entity
  parent: RMCMedalRuby
  id: RMCMedalRubyService
  name: "рубиновая медаль за службу"
  description: A deep crimson colored medal awarded for a marine's consistent service within the UNMC. This medal represent true dedication to one department and position.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalAmethyst
  name: "медаль \"Аметист\""
  description: A mythical amethyst medal, only able to be handed out by High Command due to especially special circumstances.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/amethyst.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/amethyst.rsi
      state: equipped

- type: entity
  parent: RMCMedalAmethyst
  id: RMCMedalAmethystService
  name: "медаль за службу \"Аметист\""
  description: A pale violet colored medal awarded for a marine's service within the UNMC. This medal and those after represent someone who has weathered countless long and difficult deployments but conquered and learned from them.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalEmerald
  name: "изумрудная медаль"
  description: A revered emerald medal, only able to be handed out by High Command due to especially special circumstances.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/emerald.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/emerald.rsi
      state: equipped

- type: entity
  parent: RMCMedalEmerald
  id: RMCMedalEmeraldService
  name: "изумрудная медаль за службу"
  description: A bright emerald medal awarded for a marine's service within the UNMC. Emerald medals are awarded to represent a marine's multiple years of effort to grow and learn in their position, it is one of the final awards representing a marine's career through service medals.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalPrismatic
  name: "призматическая медаль"
  description: A mythical prismatic medal, only able to be handed out by High Command due to especially special circumstances.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/prismatic.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/prismatic.rsi
      state: equipped

- type: entity
  parent: RMCMedalPrismatic
  id: RMCMedalPrismaticService
  name: "призматическая медаль за службу"
  description: A multi-colored prismatic medal awarded for a marine's service within the UNMC. Prismatic medals are traditionally awarded to those who have spent countless years of service in their position. Medals like these are generally issued directly by adjutants or staff representing members of UNMC Command as the final possible service medal.

