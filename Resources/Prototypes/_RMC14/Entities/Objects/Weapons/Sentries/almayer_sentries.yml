- type: entity
  parent: RMCBaseTurret
  id: RMCTurretAlmayer
  name: "стационарная гаусс-турель UN-635C"
  description: A fully-automated defence turret with mid-range targeting capabilities. Armed with a modified M32-S Autocannon and an internal belt feed and modified for UN warship use.
  components:
  - type: InteractionPopup
    interactDelay: 0.2
    successChance: 0.8
    interactSuccessString: petting-success-generic
    interactFailureString: petting-failure-generic
    interactSuccessSound:
      path: /Audio/Effects/double_beep.ogg
  - type: Corrodible
    isCorrodible: false
  - type: Gun
    fireRate: 2.5
  - type: BallisticAmmoProvider
    cycleable: false
    proto: RMCCartridgeSentry
    capacity: 99999
  - type: NpcFactionMember
    factions:
    - UNMC
  - type: MarineIFF
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: HTN
    rootTask:
      task: RMCTurretCompound
    blackboard:
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
      VisionRadius: !type:Single
        5.5
      AggroVisionRadius: !type:Single
        5.5
  - type: UserIFF
    factions:
    - FactionMarine
  - type: RMCHealthExaminable
    speciesType: Mechanical

- type: entity
  parent: BaseStructure
  id: RMCDeployerSentry
  name: "система развёртывания турелей"
  description: A box that deploys a sentry turret.
  components:
  - type: Transform
    anchored: true
  - type: Appearance
  - type: Sprite
    sprite: _RMC14/Structures/Machines/sentry_deployer.rsi
    layers:
    - state: floor_sentry_installed
      map: [ "enum.EquipmentDeployState.UnDeployed" ]
    - state: floor_sentry_deployed
      map: [ "enum.EquipmentDeployState.Deployed" ]
      visible: false
  - type: RMCEquipmentDeployer
    deployPrototype: RMCTurretAlmayer
    isDeployableByHand: true
    isDeployable: true
    alertLevelRequired: Red
    blacklist:
      components:
      - Xeno
  - type: InteractionOutline

- type: entity
  parent: WeaponTurretNanoTrasen
  id: RMCTurretBallisticAB
  name: "Баллистическая турель (АБ)"
  description: Автоматическая баллистическая турель. Ведёт огонь по личному составу команды ДЧ.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        hard: true
        mask:
        - MachineMask
        - BulletImpassable
        layer:
        - MachineLayer
        - BulletImpassable
  - type: Gun
    fireRate: 3
  - type: BallisticAmmoProvider
    proto: CartridgeCaselessRifle
    capacity: 500
    unspawnedCount: 500
  - type: SentryTargeting
    friendlyFactions:
    - SquadWarAB

- type: entity
  parent: WeaponTurretNanoTrasen
  id: RMCTurretBallisticDCH
  name: "Баллистическая турель (ДЧ)"
  description: Автоматическая баллистическая турель. Ведёт огонь по личному составу команды АБ.
  components:
