# PORTING CHEATSHEET
# 0: Block nothing
# 1: Block mortar placement, lasing, medevac
# 2: Block CAS signals, supply drops, fultoning, mortar fire
# 3: Block CAS
# 4: Block OB

- type: entity
  abstract: true
  id: RMCAreaBase
  name: "зона"
  suffix: Area
  placement:
    mode: SnapgridCenter
    snap:
    - RMCArea
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Areas/areas.rsi
    state: unknown
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: Area
    CAS: true
    fulton: true
    lasing: true
    mortarPlacement: true
    mortarFire: true
    medevac: true
    OB: true
    supplyDrop: true
    paradropping: true
  - type: PlacementReplacement
    key: rmc_areas

- type: entity
  parent: RMCAreaBase
  abstract: true
  id: RMCAreaProtectionZero
  name: "защита 0"
  components:
  - type: Area
    CAS: true
    fulton: true
    lasing: true
    mortar: true
    medevac: true
    OB: true
    supplyDrop: true
    paradropping: true

- type: entity
  parent: RMCAreaProtectionZero
  abstract: true
  id: RMCAreaNone
  name: "нет"

- type: entity
  parent: RMCAreaProtectionZero
  abstract: true
  id: RMCAreaGlass
  name: "стекло"

- type: entity
  parent: RMCAreaBase
  abstract: true
  id: RMCAreaProtectionOne
  name: "защита 1"
  components:
  - type: Area
    lasing: false
    mortar: false
    medevac: false
    paradropping: false

- type: entity
  parent: RMCAreaProtectionOne
  abstract: true
  id: RMCAreaProtectionMetal
  name: "металл"

- type: entity
  parent: RMCAreaBase
  abstract: true
  id: RMCAreaProtectionTwo
  name: "защита 2"
  components:
  - type: Area
    fulton: false
    supplyDrop: false

- type: entity
  parent: RMCAreaProtectionTwo
  abstract: true
  id: RMCAreaUndergroundAllowCAS
  name: "разрешить подземную CAS"

- type: entity
  parent: RMCAreaProtectionTwo
  abstract: true
  id: RMCAreaUndergroundMetalAllowCAS
  name: "разрешить подземную металлическую CAS"

- type: entity
  parent: RMCAreaBase
  abstract: true
  id: RMCAreaProtectionThree
  name: "защита 3"
  components:
  - type: Area
    CAS: false

- type: entity
  parent: RMCAreaProtectionThree
  abstract: true
  id: RMCAreaUndergroundBlockCAS
  name: "заблокировать подземную CAS"

- type: entity
  parent: RMCAreaProtectionThree
  abstract: true
  id: RMCAreaUndergroundMetalBlockCAS
  name: "заблокировать подземную металлическую CAS"

- type: entity
  parent: RMCAreaBase
  abstract: true
  id: RMCAreaProtectionFour
  name: "защита 4"
  components:
  - type: Area
    OB: false

- type: entity
  parent: RMCAreaProtectionFour
  abstract: true
  id: RMCAreaDeepUnderground
  name: "глубокая подземка"

- type: entity
  parent: RMCAreaProtectionFour
  abstract: true
  id: RMCAreaDeepUndergroundMetal
  name: "глубокая подземка metal"

- type: entity
  parent: RMCAreaProtectionFour
  abstract: true
  id: RMCAreaReinforcedMetal
  name: "усиленный металл"

- type: entity
  parent: RMCAreaProtectionFour
  abstract: true
  id: RMCAreaResin
  name: "смола"

- type: entity
  parent: RMCAreaProtectionFour
  abstract: true
  id: RMCAreaMax
  name: "макс"
