- type: Tag
  id: RMCHeadset

- type: entity
  parent: Clothing
  id: CMHeadset
  name: "радиогарнитура"
  description: An updated, modular intercom that fits over the head. Takes encryption keys.
  components:
  - type: RMCCryoUnavailableOnStore
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: Headset
  - type: EncryptionKeyHolder
    keySlots: 4 # TODO RMC14 3 when intrinsic channels are all done
  - type: Clothing
    slots:
    - ears
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/headsets.rsi
    state: generic_headset
  - type: Item
    size: Small
  - type: ClothingLimit
    id: CMHeadset
  - type: RMCRadioFilter
  - type: UserInterface
    interfaces:
      enum.RMCRadioFilterUI.Key:
        type: RMCRadioFilterBui
  - type: HeadsetMultiBroadcast
  - type: Tag
    tags:
    - RMCHeadset
  - type: RMCHeadset
  - type: GuideHelp
    guides:
    - RMCGuideMarineCommunications
    - RMCLanguage
    - RMCGuideCommunicationsTowers
    - RMCGuideRoleCombatTechnician
    - RMCGuideRoleMaintenanceTechnician

- type: entity
  parent: RMCHeadsetIconsUNMC
  id: RMCHeadsetShip
  name: "радио-гарнитура морпеха"
  description: A standard military radio headset. Bulkier than combat models.
  components:
  - type: GrantAreaInfo
  - type: GrantTacMapAlert

- type: entity
  parent: RMCHeadsetShip
  id: CMHeadsetCE
  name: "гарнитура главного инженера"
  description: The headset of the guy in charge of spooling engines, managing MTs, and tearing up the floor for scrap metal. Of robust and sturdy construction.
  components:
  - type: Sprite
    state: ce_headset
  - type: ContainerFill
    containers:
      key_slots:
      - CMEncryptionKeyCommon
      - CMEncryptionKeyCE
  - type: RMCRadioFilter
    disabledChannels:
    - MarineAlpha
    - MarineBravo
    - MarineCharlie
    - MarineDelta
    - MarineEcho
    - MarineFoxtrot
  - type: HeadsetMultiBroadcast
    cooldown: 60
  - type: RMCHeadset
    radioTextIncrease: 3
  - type: GrantSquadLeaderTracker
    defaultMode: PrimaryLandingZone
    trackerModes:
    - SquadLeader
    - PrimaryLandingZone

