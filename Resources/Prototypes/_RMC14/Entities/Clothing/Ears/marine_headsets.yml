- type: entity
  parent: RMCHeadsetShip
  id: RMCHeadsetMarine
  name: "радио-гарнитура отряда морпехов"
  description: A standard military radio headset.
  components:
  - type: GrantSquadLeaderTracker
    defaultMode: SquadLeader
    trackerModes:
    - SquadLeader
    - FireteamLeader
    - SeniorEnlistedAdvisor
    - PrimaryLandingZone
  - type: GrantTacMapAlert
  - type: HeadsetAutoSquad
  - type: RMCStaticDefaultChannel

# Alpha
- type: entity
  parent: RMCHeadsetMarine
  id: CMHeadsetAlpha
  name: "радиогарнитура отряда «Альфа»"
  description: This is used by Alpha squad members.
  components:
  - type: Sprite
    state: alpha_headset
  - type: EncryptionKeyHolder
    defaultChannel: MarineAlpha
  - type: ContainerFill
    containers:
      key_slots:
      - CMEncryptionKeyAlpha
      - CMEncryptionKeyBravo

- type: entity
  parent: CMHeadsetAlpha
  id: CMHeadsetAlphaLeader
  name: "радиогарнитура командира отряда «Альфа»"
