- type: entity
  parent: RMCShoesRed
  id: RMCShoesRedKnife
  suffix: Filled, Recon Synthetic
  description: Stylish red shoes. Somehow these ones have space to hold a knife.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Shoes/Sneakers/red.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Shoes/Sneakers/red.rsi
  - type: ItemSlots
    slots:
      item:
        name: cm-knife
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m42a2.ogg
        whitelist:
          tags:
          - Knife
          - Holdout
          - Screwdriver
          - RMCScalpel
          - ThrowingKnife
        startingItem: RMCM5Bayonet
  - type: CMItemSlots
    startingItem: RMCM5Bayonet

