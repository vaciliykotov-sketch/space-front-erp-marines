- type: entity
  abstract: true
  parent: RMCBaseUniformAccessory
  id: RMCPonchoBase
  name: "пончо"
  description: An abstract poncho.
  components:
  - type: UniformAccessory
    category: Poncho
    limit: 1
    hiddenByJacketRolling: false
    layerKey: "enum.UniformAccessoryLayer.Base"
  - type: Item
    size: Normal

- type: entity
  parent: RMCPonchoBase
  id: RMCPoncho
  name: "Пончо UNMC"
  description: The standard UNMC poncho has variations for every climate. Custom fitted to be attached to standard UNMC armor variants and worn over uniforms, it is comfortable, warming or cooling as needed, and well-fit. A marine couldn't ask for more. Affectionately referred to as a "woobie".
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Ponchos/classic.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Clothing/Accessory/Ponchos/classic.rsi
      state: poncho

