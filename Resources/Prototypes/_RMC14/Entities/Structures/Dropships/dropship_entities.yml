- type: entity
  parent: MarkerBase
  id: RMCDropshipDoorBlocker
  name: "блокиратор двери десантного корабля"
  description: Blocks barricades from being pulled into the dropship.
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      dropship:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        layer:
        - DropshipImpassable

- type: entity
  parent: CMBaseStructureCorrodible
  id: RMCUtilityAttachmentPoint
  name: "вспомогательная точка крепления"
  description: An attachment point for utility systems
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleCAS
  - type: Sprite
    sprite: _RMC14/Structures/Machines/dropship_attachment_points.rsi
    layers:
    - state: "equip_base"
      map: [ "enum.DropshipPointVisualsLayers.AttachedUtility"]
    - state: "equip_base"
      map: [ "enum.DropshipPointVisualsLayers.AttachmentBase"]
  - type: Icon
    sprite: _RMC14/Structures/Machines/dropship_attachment_points.rsi
    state: "equip_base"
  - type: Physics
    canCollide: false
  - type: Occluder
    enabled: false
  - type: InteractionOutline
  - type: Clickable
  - type: DropshipUtilityPoint
  - type: DropshipPointVisuals
  - type: Appearance
  - type: Tag
    tags:
    - RMCDropshipUtilityPoint

- type: entity
  parent: CMBaseStructureCorrodible
  id: RMCEngineAttachmentPoint
  name: "двигатель system attach point"
  description: A place where heavy equipment can be installed with a powerloader.
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleCAS
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _SpaceFront/Objects/NormandyBlack/dropship_attachments.rsi
    layers:
    - state: "fuel_base"
      map: [ "enum.DropshipPointVisualsLayers.AttachedUtility"]
      rotation: 180
      visible: false
    - state: "fuel_base"
      map: [ "enum.DropshipPointVisualsLayers.AttachmentBase"]
  - type: Icon
    sprite: _SpaceFront/Objects/NormandyBlack/dropship_attachments.rsi
    state: "fuel_base"
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Occluder
    enabled: false
  - type: InteractionOutline
  - type: Clickable
  - type: DropshipEnginePoint
  - type: DropshipPointVisuals
  - type: Appearance
  - type: Tag
    tags:
    - RMCDropshipEnginePoint
  - type: WallMount
    arc: 360

- type: entity
  abstract: true
  parent: CMBaseStructureCorrodible
  id: RMCElectronicSystemAttachPoint
  categories: [ HideSpawnMenu ]
  name: "точка крепления электронной системы"
  description: A place where heavy equipment can be installed with a powerloader.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/dropship_attachment_points.rsi
    layers:
    - state: "equip_base"
      map: [ "enum.DropshipPointVisualsLayers.AttachedUtility"]
    - state: "equip_base"
      map: [ "enum.DropshipPointVisualsLayers.AttachmentBase"]
  - type: Icon
    sprite: _RMC14/Structures/Machines/dropship_attachment_points.rsi
    state: "equip_base"
  - type: InteractionOutline
  - type: Clickable
  - type: DropshipElectronicSystemPoint
  - type: DropshipPointVisuals
  - type: Appearance
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Tag
    tags:
    - RMCDropshipElectronicSystemPoint

- type: Tag
  id: RMCDropshipEnginePoint

- type: Tag
  id: RMCDropshipElectronicSystemPoint
