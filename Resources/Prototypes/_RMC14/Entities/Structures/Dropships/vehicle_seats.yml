- type: entity
  abstract: true
  parent: CMSeatBase
  id: RMCSeatArmoredBase
  name: "бронированное сиденье"
  description: A reinforced chair designed for vehicle interiors.
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/general.rsi
    state: armor_chair
  - type: RemoveComponents
    components:
    - type: Damageable
    - type: Destructible
    - type: Corrodible

- type: entity
  parent: RMCSeatArmoredBase
  id: RMCSeatArmored
  name: "бронированное сиденье"

- type: entity
  parent: RMCSeatArmoredBase
  id: RMCSeatArmoredDriver
  name: "бронированное сиденье водителя"
  components:
  - type: VehicleDriverSeat
    skills:
      all:
        RMCSkillVehicles: 2

- type: entity
  parent: RMCSeatArmoredBase
  id: RMCSeatArmoredWeaponsOperator
  name: "бронированное сиденье оператора вооружения"
  components:
  - type: VehicleWeaponsSeat
    skills:
      all:
        RMCSkillVehicles: 2
    isPrimaryOperatorSeat: true
    allowUiSelection: true
    allowHotbarSelection: true
  - type: UserInterface
    interfaces:
      enum.VehicleWeaponsUiKey.Key:
        type: VehicleWeaponsBoundUserInterface

- type: entity
  parent: RMCSeatArmoredBase
  id: RMCSeatArmoredPortGunOperator
  name: "бронированное сиденье оператора бортового орудия"
  components:
  - type: VehiclePortGunSeat
    skills:
      all: {}

- type: entity
  parent: RMCSeatArmoredBase
  id: RMCSeatTankDriver
  name: "танк driver seat"
  placement:
    mode: SnapgridCenter
  components:
  - type: VehicleDriverSeat
    skills:
      all:
        RMCSkillVehicles: 3
  - type: VehicleWeaponsSeat
    skills:
      all: {}
    isPrimaryOperatorSeat: false
    allowUiSelection: false
    allowHotbarSelection: true
    allowedHardpointTypes:
    - HardpointTypeSupport
  - type: UserInterface
    interfaces:
      enum.VehicleWeaponsUiKey.Key:
        type: VehicleWeaponsBoundUserInterface

- type: entity
  parent: RMCSeatArmoredBase
  id: RMCSeatTankGunner
  name: "танк gunner seat"
  placement:
