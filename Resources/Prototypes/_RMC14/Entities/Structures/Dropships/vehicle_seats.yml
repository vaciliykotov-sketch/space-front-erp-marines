- type: entity
  parent: CMSeatBase
  id: CMSeatPassenger
  name: "пассажирское сиденье"
  description: A sturdy chair with a brace that lowers over your body. Prevents being flung around in vehicle during crash being injured as a result. Fasten your seatbelts, kids! Fix with welding tool in case of damage.
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: base

- type: entity
  parent: CMSeatBase
  id: CMSeatPilot
  name: "кресло пилота"
  description: A specially designed chair for pilots to sit in.
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: pilot_chair
  - type: RemoveComponents
    components:
    - type: Damageable

- type: entity
  parent: CMSeatBase
  id: RMCSeatDriver
  name: "кресло водителя"
  description: A specially designed chair for driver to sit in.
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: pilot_chair
  - type: VehicleDriverSeat
    skills:
      all:
        RMCSkillVehicles: 1
  - type: RemoveComponents
    components:
    - type: Damageable
    - type: Destructible
    - type: Corrodible

- type: entity
  parent: RMCSeatDriver
  id: RMCSeatVanDriver
  name: "фургон driver seat"
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/chairs.rsi
    state: comfychair

- type: entity
  parent: CMSeatBase
  id: RMCSeatHunter
  name: "стул охотника"
  description: An exquisitely crafted chair for a large humanoid hunter.
  placement:
    mode: PlaceFree
  components:
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: chair

