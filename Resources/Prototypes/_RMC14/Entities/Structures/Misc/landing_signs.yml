  description: A large sign that reads 'WEYA - TMCC Mining - HBP - LZ - 01' The Tartarus Mining logo is adorns the sign.
  components:
  - type: Sprite
    state: hybrisamining_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCChancesClaimLandingSign
  name: "Указатель зоны посадки Заявки Ченса"
  description: A large sign that reads 'Chance's Claim', with information regarding the colony written in the corner. Most of the sign is damaged from the constant wind and rain, although the writing and corporate-coloured accents seem to have been repainted.
  components:
  - type: Sprite
    state: chances_claim

- type: entity
  parent: RMCBaseLandingSign
  id: RMCPortNereidCargoSign
  name: "Порт Нереида — грузовой склад Weston-Yamada AC-170 — указатель посадочной зоны один"
  description: A large sign that identifies this area as "Cargo Depot AC-170". It's clearly seen many days of rain, and jungle flora has started to creep up it.
  components:
  - type: Sprite
    state: nereidcargo_sign

- type: entity
  parent: RMCBaseLandingSign
  id: RMCPortNereidSpaceportSign
  name: "Порт Нереида — международный космопорт Порт Нереида - Landing Zone two sign"
  description: A large sign that reads 'Port Nereid Spaceport". Under the blue light, you can read some incredibly mundane information about the colony, above a sweeping graphic of what appears to be a stylized spaceship. Although the sign has some vine growing on it, it's clear it's been repainted many times, keeping it clean and sleek.
  components:
  - type: Sprite
    state: nereidspaceport_sign

