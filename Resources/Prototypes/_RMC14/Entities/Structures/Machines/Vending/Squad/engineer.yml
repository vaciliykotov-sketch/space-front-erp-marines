- type: entity
  parent: ColMarTechBase
  id: ColMarTechSCTEquipment
  name: "Стойка снаряжения отряда комтеха ASRS"
  description: An automated rack hooked up to a colossal storage of combat technician standard-issue equipment.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: AccessReader
    access:
    - [ "CMAccessCombatTechPrep" ]
  - type: CMAutomatedVendor
    jobs:
    - CMCombatTech
    sections:
    - name: Standard Equipment
      takeAll: CMStandard
      entries:
      - id: CMVendorBundleCombatTechnicianApparel
      - id: CMMRE
    - name: Gloves
      choices: { CMHands: 1 }
      entries:
      - id: CMHandsInsulated
      - id: CMHandsBlackInsulated
    - name: Helmet
      choices: { CMHelmet: 1 }
      entries:
      - id: CMArmorHelmetM10Tech
      - id: RMCArmorHelmetM10Welding
    - name: Броня
      choices: { CMArmor: 1 }
      entries:
      - id: RMCArmorVestSquad
      - id: RMCArmorM3LightVariants
        name: "лёгкая броня"
      - id: RMCArmorM3MediumVariants
        name: "средняя броня"
        recommended: true
      - id: RMCArmorM3HeavyVariants
        name: "тяжёлая броня"
    - name: Backpack
      choices: { CMBackpack: 1 }
      entries:
      - id: RMCScabbardMacheteFilled
        points: 1
        name: "ножны для мачете (полные)"
      - id: CMBackpackMarineTech
        replaceSlot: back
      - id: CMSatchelMarineTech
        replaceSlot: back
      - id: CMBackpackWelder
        replaceSlot: back
        recommended: true
      - id: RMCSatchelWelder
        replaceSlot: back
      - id: RMCSatchelWelderChestrig
        replaceSlot: back
        recommended: true
    - name: Belt
      choices: { CMBelt: 1 }
      entries:
      - id: RMCBeltConstruction
        recommended: true
      - id: CMBeltUtilityFilled
        name: "Снаряжение с поясом для инструментов образца M276 (Full)"
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMarine
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterRevolver
      - id: RMCBeltHolsterSMG
      - id: RMCBeltHolsterSMGPouch
      - id: RMCM82FHolster
      - id: RMCM276ShotgunShellLoadingRig
      - id: RMCBeltGrenade
    - name: Подсумокes
      choices: { RMCPouch: 2 }
      entries:
      - id: RMCPouchConstruction
        recommended: true
      - id: RMCPouchFirstAidInjectors
        name: "аптечка (заправляемые инъекторы)"
        recommended: true
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: "аптечка (марля, мазь)" # TODO RMC14 splints comma
        recommended: true
      - id: RMCPouchFirstAidPills
        name: "аптечка (таблетки)"
        recommended: true
      - id: RMCPouchElectronicsFill
        name: "подсумок для электроники (Full)"
      - id: RMCPouchExplosive
      - id: RMCPouchFlareFilled
        name: "Фальшфейер pouch (Full)"
      - id: RMCPouchMagazinePistolLarge
      - id: RMCPouchMagazine
      - id: RMCPouchShotgun
      - id: RMCPouchGeneralMedium
      - id: RMCPouchPistol
      - id: RMCPouchToolsFill
        name: "Сумка для инструментов (полная)"
      - id: RMCPouchEngineerKit
    - name: Accessories
      choices: { CMAccessories: 1 }
      entries:
      - id: RMCToolWebbingSmallFilled
        name: "маленькая разгрузка для инструментов (Full)"
        recommended: true
      - id: CMWebbingBlack
      - id: CMWebbingBrown
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: Mask
      choices: { CMMask: 1 }
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif
      - id: RMCMaskRebreather

- type: entity
  parent: ColMarTechBase
  id: ColMarTechSCTTools
  name: "Автомат инструментов отряда комтеха ASRS"
  description: A vending machine that stores various extra tools that are useful on the field.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessCombatTechPrep" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/tool.rsi
    layers:
    - state: "off"
      map: [ "enum.VendingMachineVisualLayers.Base" ]
    - state: "normal-unshaded"
      map: [ "enum.VendingMachineVisualLayers.BaseUnshaded" ]
  - type: CMAutomatedVendor
    canManualRestock: true
    access:
    - "CMAccessCombatTechPrep"
    hackable: true
    jobs:
    - CMCombatTech
    sections:
    - name: Equipment
      entries:
      - id: CMBeltUtility
        amount: 4
        name: "вспомогательный пояс для инструментов"
      - id: RMCCableCoil
        amount: 4
      - id: RMCWeldingGoggles
        amount: 2
      - id: RMCEngineerKit
        amount: 2
    - name: Tools
      entries:
      - id: CMWelder
        amount: 4
      - id: CMCrowbar
        amount: 4
      - id: CMScrewdriver
        amount: 4
      - id: CMWirecutter
        amount: 4
      - id: CMWrench
        amount: 4
      - id: CMMultitool
        amount: 4
      - id: CMWelderSmall
        amount: 2
      - id: RMCLightReplacer
        amount: 4
    - name: Utility
      entries:
      - id: RMCSentryLaptop
        amount: 4
        name: "ноутбук сети турелей"
