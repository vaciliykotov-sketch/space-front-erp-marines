- type: entity
  parent: ColMarTechBase
  id: ColMarTechSLEquipment
  name: "Стойка снаряжения командира отряда ASRS"
  description: An automated rack hooked up to a colossal storage of Squad Leader standard-issue equipment.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessSquadLeaderPrep" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMSquadLeader
    sections:
    - name: Standard Equipment
      takeAll: CMStandard
      entries:
      - id: CMVendorBundleSquadLeaderApparel
      - id: RMCBackpackRTO
        points: 1
        replaceSlot: back
      - id: CMMRE
    - name: Броня
      choices: { CMArmour: 1 }
      entries:
      - id: RMCArmorB12Zipties
        name: "командирская броня морпеха образца B12 (zipties)"
        recommended: true
      - id: RMCArmorM4Zipties
        name: "командирская броня морпеха образца M4 (zipties)"
      - id: RMCArmorVestSquadLeader
        name: "командирский бронежилет образца M3-XL (стяжки)"
    - name: Backpack
      choices: { CMBackpack: 1 }
      entries:
      - id: CMBackpackMarine
      - id: RMCScabbardMacheteFilled
        points: 1
      - id: CMSatchelMarine
        recommended: true
    - name: Belt
      choices: { CMBelt: 1 }
