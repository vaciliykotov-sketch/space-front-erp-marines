        name: "Снаряжение с поясом для инструментов образца M276 (Full)"
      - id: RMCBeltGrenade
    - name: Подсумокes
      choices: { RMCPouch: 2 }
      entries:
      - id: RMCPouchAutoinjectorFill
        recommended: true
      - id: RMCPouchFirstAidInjectors
        name: "аптечка (заправляемые инъекторы)"
