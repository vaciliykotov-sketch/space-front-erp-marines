- type: entity
  parent: RMCKitBase
  id: RMCKitPyroMini
  name: "Набор поддержки пиротехника M34"
  description: Contains a M34 incinerator unit, a G4-1 fueltank, 3 incinerator tanks, and a portable fire extinguisher.
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,1
