- type: entity
  parent: ColMarTechBaseAnchorable
  id: CMVendorBooze
  name: "Алкомат"
  description: A technological marvel, supposedly able to mix just the mixture you'd like to drink the moment you ask for one.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/boozeomat.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "normal-unshaded"
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      shader: unshaded
  - type: ApcPowerReceiver
    needsPower: true
  - type: RMCPowerReceiver # Still requires power to vend though
    idleLoad: 0
    activeLoad: 0
    channel: Equipment
  - type: AccessReader
    access:
    - [ "CMAccessKitchen" ]
    - [ "CMAccessColonyPublic" ]
  - type: Corrodible
    timeToApply: 4
    structure: true
  - type: CMAutomatedVendor
    access:
    - "CMAccessKitchen"
    - "CMAccessColonyPublic"
    hackable: true
    scaling: false
    randomUnstockAmount: 3 # between 1 and 3
    randomEmptyChance: 0.25 # 25% chance
    sections:
    - name: Alcohol
      entries:
      - id: CMDrinkCanAle
        amount: 6
        name: "эль"
      - id: CMDrinkCanBeerLite
        amount: 6
        name: "пиво"
