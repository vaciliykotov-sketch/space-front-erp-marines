
- type: entity
  parent: ColMarTechBase
  id: ColMarTechCrewCombatCorrespondent
  name: "Стойка снаряжения боевого корреспондента ASRS"
  description: An automated rack hooked up to a colossal storage of Reporter standard-issue equipment.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessPress" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMCorrespondent
    - CMCombatCorrespondent
    sections:
    - name: Standard Equipment
      takeAll: CMStandard
      entries:
      - id: RMCVendorBundleCrewCombatCorrespondent
      - id: RMCCameraBroadcasting
        name: "Прессовая трансляционная камера"
        recommended: true
    - name: Гражданский Equipment
      jobs:
      - CMCorrespondent
      takeAll: CMCivilian
      entries:
      - id: RMCPortablePressFax
        name: "Портативный прессовый факс"
        recommended: true
      - id: RMCTentUNMCExtendedCorrespondentFolded
        name: "Корреспондент Field Tent"
    - name: Satchel
      jobs:
      - CMCorrespondent
      choices: { CMSatchel: 1 }
      entries:
      - id: CMSatchel
        name: "Кожаная сумка"
      - id: RMCBackpackRTOBagPhone
        name: "Портативная сумка для телефона"
    - name: Combat Backpack
      jobs:
      - CMCombatCorrespondent
      choices: { CMBackpack: 1 }
      entries:
      - id: CMBackpackMarine
        replaceSlot: back
        name: "Морпех Backpack"
      - id: CMSatchelMarine
        replaceSlot: back
        name: "Морпех Satchel"
        recommended: true
    - name: Combat Sidearm
      jobs:
      - CMCombatCorrespondent
      choices: { CMBelt: 1 }
      entries:
      - id: RMCM1984BeltFilled
        name: "Кобура для пистолета M1984"
        recommended: true
    - name: Combat Webbing
      jobs:
      - CMCombatCorrespondent
      choices: { CMWebbing: 1 }
      entries:
      - id: CMWebbingBrown
        name: "Коричневая разгрузка"
        recommended: true
    - name: Combat Pouches
      jobs:
      - CMCombatCorrespondent
      choices: { RMCPouch: 2 }
      entries:
      - id: RMCPouchGeneralMedium
        name: "Средний универсальный подсумок"
        recommended: true
    - name: Uniform
      choices: { CMUniform: 1 }
      entries:
      - id: RMCJumpsuitCorrespondentBlack
        name: "Чёрная униформа"
      - id: RMCJumpsuitCorrespondentOrange
        name: "Оранжевая униформа"
      - id: RMCJumpsuitCorrespondentRed
        name: "Красная униформа"
    - name: Броня
      choices: { CMArmor: 1 }
      entries:
      - id: CMArmorPress
        name: "Боевой корреспондент's Armor"
        recommended: true
      - id: RMCCoatCorrespondentBlue
        name: "Синий жилет"
      - id: RMCHazardVestBlack
        name: "Чёрный жилет"
      - id: RMCCoatCorrespondentBlack
        name: "Чёрное пальто"
      - id: RMCCoatCorrespondentGreen
        name: "Зелёное пальто"
      - id: RMCCoatCorrespondent
        name: "Коричневое пальто"
      - id: RMCCoatCorrespondentGreenJacket
        name: "Зелёная куртка"
      - id: RMCCoatCorrespondentBlueJacket
        name: "Синяя куртка"
      - id: RMCCoatCorrespondentTan
        name: "песочная куртка"
      - id: RMCCoatCorrespondentBrownJacket
        name: "Коричневая куртка"
    - name: Helmet
      choices: { CMHelmet: 1 }
      entries:
      - id: CMArmorHelmetPress
        name: "Боевой корреспондент's Helmet"
        recommended: true
      - id: RMCHeadCapCorrespondent
        name: "Боевой корреспондент's Cap"
      - id: RMCHeadCapFedoraGrey
        name: "Федора"
    - name: Refills
      entries:
      - id: RMCBoxRegulationTapes
        points: 1
        name: "Регламентные ленты"
      - id: CMPaperBin30
        points: 1
        name: "Корзина для бумаг"
