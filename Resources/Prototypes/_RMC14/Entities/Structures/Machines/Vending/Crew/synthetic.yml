- type: entity
  parent: ColMarTechBase
  id: ColMarTechCrewSynthetic
  name: "Стеллаж синтетического снаряжения ASRS"
  description: An automated rack hooked up to a colossal storage of various equipment. Can be accessed only by synthetic units.
  components:
  - type: AccessReader
    access:
    - [ "RMCAccessSynth" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - RMCJobSynthetic
    sections:
    - name: Standard Equipment
      takeAll: CMStandard
      entries:
      - id: RMCSynthResetKey
      - id: RMCHeadsetSynth
    - name: Uniform
      choices: { CMUniform: 1 }
      entries:
      - id: RMCJumpsuitSynthetic
      - id: JumpsuitMarine
      - id: CMJumpsuitMarineMedic
    - name: Webbing
      choices: { CMAccessories: 1 }
      entries:
      - id: CMWebbingBrown
        recommended: true
      - id: CMWebbingBlack
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: Shoes
      choices: { RMCShoes: 1 }
      entries:
      - id: RMCShoesWhite
        recommended: true
      - id: CMBootsBlackFilled
    - name: Helmet
      choices: { CMHelmet: 1 }
      entries:
      - id: RMCHardhatOrange
        name: "оранжевая каска"
      - id: RMCHelmetWelding
      - id: CMHeadFlapCap
    - name: Suit # Parity Vendor Fill has one for the map's camo, then still lets the synth choose from any of the options. Hence why this has so many options.
      choices: { CMSuit: 1 }
      entries:
      - id: CMArmorM3VLSynth
        recommended: true
      - id: CMArmorM3VLSynthJungle
      - id: CMArmorM3VLSynthDesert
      - id: CMArmorM3VLSynthSnow
      - id: CMArmorM3VLSynthClassic
      - id: CMArmorM3VLSynthUrban
    - name: Gloves
      choices: { CMGloves: 1 }
      entries:
      - id: CMHandsInsulated
        recommended: true
      - id: CMHandsBlackInsulated
        recommended: true
      - id: CMHandsBlackMarine
      - id: CMHandsLatex
    - name: Backpack
      choices: { CMBackpack: 1 }
      entries:
      - id: RMCSmartpack
        name: "Умный рюкзак S-V42, синий"
        recommended: true
      - id: RMCSmartpackBlack
        name: "Умный рюкзак S-V42, чёрный"
      - id: RMCSmartpackGreen
        name: "Умный рюкзак S-V42, зелёный"
      - id: RMCSmartpackTan
        name: "Умный рюкзак S-V42, песочный"
      - id: RMCSmartpackWhite
        name: "Умный рюкзак S-V42, белый"
      - id: RMCSmartpackA1
        name: "Умный рюкзак S-V42A1, синий"
      - id: RMCSmartpackA1Black
        name: "Умный рюкзак S-V42A1, чёрный"
      - id: RMCSmartpackA1Green
        name: "Умный рюкзак S-V42A1, зелёный"
      - id: RMCSmartpackA1Tan
        name: "Умный рюкзак S-V42A1, песочный"
      - id: RMCSmartpackA1White
        name: "Умный рюкзак S-V42A1, белый"
    - name: Belt
      choices: { CMBelt: 1 }
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMedicBagFilled
        name: "Сумка спасателя образца M276 (Full)"
      - id: CMBeltMedicalFilled
        name: "Снаряжение для хранения медикаментов M276 (полное)"
      - id: CMBeltUtilityFilled
        name: "Снаряжение с поясом для инструментов M276 (полное)"
    - name: Подсумокes
      choices: { CMPouch: 2 }
      entries:
      - id: RMCPouchAutoinjector
      - id: RMCPouchConstruction
      - id: RMCPouchDocument
      - id: RMCPouchElectronicsFill
        name: "подсумок для электроники (Full)"
      - id: RMCPouchFirstAidInjectors
        name: "сумка первой помощи (refillable injectors)"
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: "сумка первой помощи (gauze, ointment)" # TODO RMC14 splints comma
      - id: RMCPouchFirstAidPills
        name: "сумка первой помощи (pills)"
      - id: RMCPouchFlareFilled
        name: "Фальшфейер pouch (Full)"
      - id: RMCPouchGeneralLarge
      - id: RMCPouchSling
      - id: RMCPouchMedical
      - id: RMCPouchMedkit
      - id: RMCPouchReagentCanisterTricordrazineRevival
        name: Pressurized Reagent Canister Pouch\n(Revival Mix - Tricordrazine)
      - id: RMCPouchReagentCanisterBicaridine
        name: Pressurized Reagent Canister Pouch\n(Bicaridine)
      - id: RMCPouchReagentCanisterKelotane
        name: Pressurized Reagent Canister Pouch\n(Kelotane)
      - id: RMCPouchReagentCanisterTricordrazine
        name: Pressurized Reagent Canister Pouch\n(Tricordrazine)
      - id: RMCPouchReagentCanister
        name: Pressurized Reagent Canister Pouch\n(EMPTY)
      - id: RMCPouchToolsFill
        name: "сумка для инструментов (Full)"
      - id: RMCPouchMacheteFilled
        name: "подсумок для мачете (полный)"
    - name: Подсумокes
      choices: { CMMask: 1 }
      entries:
      - id: CMMaskSterile

- type: entity
  parent: ColMarTechCrewSynthetic
  id: ColMarTechCrewSyntheticColony
