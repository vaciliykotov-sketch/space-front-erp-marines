- type: entity
  id: ActionToggleMarineHud
  name: "Переключить HUD морпеха"
  description: Toggle marine icons.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Interface/job_icons/UNMC/command.rsi
      state: hudsquad_co
    iconOn:
      sprite: _RMC14/Interface/job_icons/UNMC/command.rsi
      state: hudsquad_co
  - type: InstantAction
    event: !type:ToggleMarineHudActionEvent

- type: entity
  id: ActionToggleXenoHud
  name: "Переключить HUD ксеноморфа"
  description: Toggle xeno health and plasma bars.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Interface/Alerts/xeno_health.rsi
      state: health_full
    iconOn:
      sprite: _RMC14/Interface/Alerts/xeno_health.rsi
      state: health_full
  - type: InstantAction
    event: !type:ToggleXenoHudActionEvent

- type: entity
  parent: BaseMentalAction
  id: RMCActionToggleDeadChat
  name: "Отключить чат мёртвых"
  description: Suppress dead chat messages and speech bubbles.
  components:
  - type: Action
    checkCanInteract: false
    clientExclusive: true
    icon:
      sprite: Clothing/Ears/Headsets/base.rsi
      state: icon
    iconOn: Interface/Actions/ghostHearingToggled.png
  - type: InstantAction
    event: !type:ToggleDeadChatActionEvent

- type: entity
  id: ActionFindParasite
  name: "Найти паразита"
  description: Find Ghostrolable Parasites
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Actions/observer_actions.rsi
      state: find_parasite
  - type: InstantAction
    event: !type:FindParasiteActionEvent

- type: entity
  id: ActionJoinXeno
  name: "Присоединиться как ксенос"
  description: Find burrowed larva to join as.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Actions/observer_actions.rsi
      state: join_xeno
    useDelay: 0.5
  - type: InstantAction
    event: !type:JoinXenoActionEvent

- type: entity
  id: ActionToggleVisibility
  name: "Переключить видимость"
  description: Toggles your visibility, while you're invisible your friend can still hear what you say.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi #TODO Find a better icon
      state: icon
    iconOn:
      sprite: Mobs/Ghosts/ghost_human.rsi #TODO Find a better icon
      state: icon
  - type: InstantAction
    event: !type:ImaginaryFriendToggleVisibilityActionEvent

- type: entity
  id: ActionStopBeingFriends
  name: "Покинуть друга"
  description: Stop being an imaginary friend.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _RMC14/Actions/marine_emplacement_actions.rsi #TODO Find a better icon
      state: cancel_view
  - type: InstantAction
    event: !type:ImaginaryFriendStopBeingFriendsActionEvent
